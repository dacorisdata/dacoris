services:
  db:
    image: postgres:15-alpine
    container_name: dacoris-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dacoris-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dacoris-backend-prod
    env_file:
      - .env.production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dacoris-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
    container_name: dacoris-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_ORCID_CLIENT_ID=${ORCID_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - dacoris-network
    restart: always

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dacoris-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dacoris-network
    restart: always

volumes:
  postgres_data:

networks:
  dacoris-network:
    driver: bridge

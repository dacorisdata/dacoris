name: CD - Deploy to Staging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dacoris-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dacoris-frontend
  NGINX_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dacoris-nginx

jobs:
  deploy-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment directory
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} '
            mkdir -p /home/dacoris
            mkdir -p /var/backups/dacoris
          '
      
      - name: Copy deployment files
        run: |
          scp docker-compose.prod.yml ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/home/dacoris/docker-compose.yml
          scp -r nginx ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/home/dacoris/
      
      - name: Create environment file
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} '
            cat > /home/dacoris/.env.production << EOF
          PORT=8000
          FRONTEND_URL=${{ secrets.STAGING_URL }}
          
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=dacoris
          DATABASE_URL=postgresql+asyncpg://postgres:${{ secrets.DB_PASSWORD }}@db:5432/dacoris
          
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          ADMIN_SESSION_EXPIRE_MINUTES=480
          
          ORCID_CLIENT_ID=${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET=${{ secrets.ORCID_CLIENT_SECRET }}
          ORCID_REDIRECT_URI=${{ secrets.STAGING_URL }}/api/auth/orcid/callback
          ORCID_SANDBOX_MODE=true
          ORCID_API_BASE_URL=https://sandbox.orcid.org
          
          GLOBAL_ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          UPLOAD_DIR=/app/uploads
          MAX_FILE_SIZE_MB=50
          NOTIFICATION_MODE=email
          
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL="${{ secrets.FROM_EMAIL }}"
          
          KOBO_API_BASE_URL=https://kf.kobotoolbox.org/api/v2
          EOF
          '
      
      - name: Deploy application
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} '
            cd /home/dacoris
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull latest images
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest
            docker pull ${{ env.NGINX_IMAGE }}:latest
            
            # Stop and remove old containers
            docker-compose down || true
            
            # Start new containers
            docker-compose up -d
            
            # Wait for services to be healthy
            sleep 15
            
            # Run database migrations
            docker exec dacoris-backend-prod alembic upgrade head || echo "Migration failed or already up to date"
          '
      
      - name: Health check
        run: |
          sleep 20
          max_attempts=5
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_URL }}/api/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Staging deployment successful!"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: Health check returned $response. Retrying..."
            sleep 10
            attempt=$((attempt + 1))
          done
          
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        continue-on-error: true
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip database backup (not recommended)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://41.89.92.140
    
    steps:
      
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key
          cat > ~/.ssh/id_ed25519 << 'EOF'
          ${{ secrets.PRODUCTION_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          
          # Verify key format
          echo "🔍 SSH key first line:"
          head -1 ~/.ssh/id_ed25519
          echo "🔍 SSH key last line:"
          tail -1 ~/.ssh/id_ed25519
          echo "🔍 SSH key line count:"
          wc -l ~/.ssh/id_ed25519
          
          # Add host key
          ssh-keyscan -p 22000 -H 41.89.92.140 >> ~/.ssh/known_hosts 2>/dev/null
          
          # Create SSH config
          cat > ~/.ssh/config << 'EOF'
          Host 41.89.92.140
            Port 22000
            User dacoris
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config
          
          # Test SSH connection with verbose output
          echo "🔐 Testing SSH connection..."
          ssh -vvv dacoris@41.89.92.140 'echo "✅ Connected!"' 2>&1 | grep -E "(debug1|Offering|Authentications|Permission)" || true
      
      - name: Backup database
        if: ${{ !inputs.skip_backup }}
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            # Create backup directory
            mkdir -p /var/backups/dacoris
            
            # Backup database (DB name/user from .env.production)
            echo "💾 Creating database backup..."
            set -a
            . ./.env.production
            set +a
            docker exec dacoris-db-prod pg_dump -U "${DB_USER:-dacoris}" "${DB_NAME:-dacoris_rims}" | gzip > /var/backups/dacoris/backup-$(date +%Y%m%d_%H%M%S).sql.gz || echo "⚠️  Database backup failed"
          '
      
      - name: Pull latest code
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main
            
            echo "📝 Recent commits:"
            git log -3 --oneline
          '
      
      - name: Verify environment file
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            if [ ! -f .env.production ]; then
              echo "❌ .env.production file not found!"
              echo "Please create .env.production on the server before deploying."
              exit 1
            fi
            
            echo "✅ .env.production file exists"
          '
      
      - name: Deploy with Docker Compose
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            echo "🐳 Deploying services with Docker Compose..."
            
            # Stop and remove existing containers (preserves database)
            docker compose -f docker-compose.prod.yml --env-file .env.production down
            
            # Pull/rebuild images and start all services
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            
            echo "⏳ Waiting for services to start..."
            sleep 20
          '
      
      - name: Run database migrations
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            echo "📊 Running database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend alembic upgrade head || echo "⚠️  Migrations failed or already up to date"
          '
      
      - name: Verify deployment
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            echo "✅ Checking container status..."
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
          '
      
      - name: Health check
        run: |
          sleep 10
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://41.89.92.140/api/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Production deployment successful!"
              echo "🌐 Application: http://41.89.92.140"
              echo "📚 API Docs: http://41.89.92.140/apiDocs"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: Health check returned $response. Retrying..."
            sleep 10
            attempt=$((attempt + 1))
          done
          
          echo "❌ Health check failed after $max_attempts attempts"
          echo "📋 Checking logs..."
          ssh dacoris@41.89.92.140 'cd /opt/dacoris/rims && docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=50'
          exit 1
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Showing recent logs..."
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            echo "=== Backend Logs ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production logs backend --tail=100
            echo ""
            echo "=== Frontend Logs ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production logs frontend --tail=100
            echo ""
            echo "=== Database Logs ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production logs db --tail=50
          '
          echo ""
          echo "💡 To rollback manually, SSH to the server and run:"
          echo "   cd /opt/dacoris/rims"
          echo "   git reset --hard HEAD~1"
          echo "   docker compose -f docker-compose.prod.yml --env-file .env.production down"
          echo "   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build"
      
      - name: Deployment summary
        if: success()
        run: |
          echo "✨ Deployment completed successfully!"
          echo "📅 Time: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🌐 Application: http://41.89.92.140"
          echo "📚 API Docs: http://41.89.92.140/apiDocs"

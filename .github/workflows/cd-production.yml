name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip database backup (not recommended)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rims.dacoris.com
    
    steps:
      
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key
          cat > ~/.ssh/id_ed25519 << 'EOF'
          ${{ secrets.PRODUCTION_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          
          # Verify key format
          echo "🔍 SSH key first line:"
          head -1 ~/.ssh/id_ed25519
          echo "🔍 SSH key last line:"
          tail -1 ~/.ssh/id_ed25519
          echo "🔍 SSH key line count:"
          wc -l ~/.ssh/id_ed25519
          
          # Add host key
          ssh-keyscan -p 22000 -H 41.89.92.140 >> ~/.ssh/known_hosts 2>/dev/null
          
          # Create SSH config
          cat > ~/.ssh/config << 'EOF'
          Host 41.89.92.140
            Port 22000
            User dacoris
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config
          
          # Test SSH connection with verbose output
          echo "🔐 Testing SSH connection..."
          ssh -vvv dacoris@41.89.92.140 'echo "✅ Connected!"' 2>&1 | grep -E "(debug1|Offering|Authentications|Permission)" || true
      
      - name: Backup database
        if: ${{ !inputs.skip_backup }}
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            # Create backup directory
            mkdir -p /var/backups/dacoris
            
            # Backup database (DB name/user from .env.production)
            echo "💾 Creating database backup..."
            set -a
            . ./.env.production
            set +a
            docker exec dacoris_rims_db pg_dump -U "${DB_USER:-dacoris}" "${DB_NAME:-dacoris_rims}" | gzip > /var/backups/dacoris/backup-$(date +%Y%m%d_%H%M%S).sql.gz || echo "⚠️  Database backup failed"
          '
      
      - name: Pull latest code
        run: |
          ssh dacoris@41.89.92.140 '
            set -euo pipefail
            cd /opt/dacoris/rims

            echo "📥 Syncing /opt/dacoris/rims to ${{ github.sha }}..."
            KEEP_DIR=$(mktemp -d)
            for f in .env .env.production docker-compose.prod.yml; do
              if [ -f "$f" ]; then
                cp -a "$f" "$KEEP_DIR/"
              fi
            done

            git fetch origin main
            git reset --hard "${{ github.sha }}"
            git clean -fd --exclude=.env --exclude=.env.production --exclude=backend/uploads --exclude=backend/data --exclude=nginx/ssl

            for f in .env .env.production docker-compose.prod.yml; do
              if [ -f "$KEEP_DIR/$f" ]; then
                cp -a "$KEEP_DIR/$f" "$f"
              fi
            done
            rm -rf "$KEEP_DIR"

            HEAD=$(git rev-parse HEAD)
            EXPECTED="${{ github.sha }}"
            echo "Server HEAD: $HEAD"
            echo "Expected:    $EXPECTED"
            if [ "$HEAD" != "$EXPECTED" ]; then
              echo "ERROR: production checkout did not match the GitHub Actions commit"
              git log -3 --oneline
              exit 1
            fi

            echo "📝 Recent commits:"
            git log -3 --oneline
            git status --short

            if ! grep -q "demo@kibu.ac.ke" frontend/lib/demoRoles.js; then
              echo "ERROR: frontend/lib/demoRoles.js does not contain demo@kibu.ac.ke after checkout"
              exit 1
            fi

            XLSX=backend/data/DACORIS_IS_v2.xlsx
            SIZE=$(stat -c%s "$XLSX")
            echo "Excel size on host: $SIZE"
            if [ "$SIZE" -lt 120000 ]; then
              echo "ERROR: $XLSX was not updated (size $SIZE). Expected the Kibabii workbook (>=120000 bytes)."
              exit 1
            fi
          '
      
      - name: Verify environment file
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            if [ ! -f .env.production ]; then
              echo "❌ .env.production file not found!"
              echo "Please create .env.production on the server before deploying."
              exit 1
            fi
            
            echo "✅ .env.production file exists"
          '
      
      - name: Deploy with Docker Compose
        run: |
          ssh dacoris@41.89.92.140 '
            set -euo pipefail
            cd /opt/dacoris/rims

            echo "🐳 Rebuilding images with no cache (frontend + backend + nginx)..."
            docker compose -f docker-compose.prod.yml --env-file .env.production build --no-cache
            echo "🐳 Recreating containers..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate --remove-orphans

            echo "⏳ Waiting for services to start..."
            sleep 20
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
          '
      
      - name: Run database migrations
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            echo "📊 Running database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend alembic upgrade head || echo "⚠️  Migrations failed or already up to date"
          '
      
      - name: Verify deployment
        run: |
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            
            echo "✅ Checking container status..."
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
          '
      
      - name: Health check
        run: |
          sleep 10
          max_attempts=10
          attempt=1
          
          # Nginx is published on host port 8081 (not 80). Check via SSH on the server.
          while [ $attempt -le $max_attempts ]; do
            response=$(ssh dacoris@41.89.92.140 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/api/health' || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Production deployment successful!"
              echo "🌐 Application: https://rims.dacoris.com"
              echo "📚 API Docs: https://rims.dacoris.com/apiDocs"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: Health check returned $response. Retrying..."
            sleep 10
            attempt=$((attempt + 1))
          done
          
          echo "❌ Health check failed after $max_attempts attempts"
          echo "📋 Checking logs..."
          ssh dacoris@41.89.92.140 'cd /opt/dacoris/rims && docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=50'
          exit 1

      - name: Verify frontend bundle
        run: |
          ssh dacoris@41.89.92.140 '
            set -euo pipefail
            cd /opt/dacoris/rims
            echo "Checking rebuilt frontend for demo@kibu.ac.ke..."
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T frontend sh -c "grep -R demo@kibu.ac.ke /app /app/.next 2>/dev/null | head -c 400"
          '

      - name: Verify IS spreadsheet loaded
        run: |
          ssh dacoris@41.89.92.140 bash -s <<'ENDSSH'
            set -euo pipefail
            cd /opt/dacoris/rims
            echo "Checking DACORIS_IS_v2.xlsx inside the backend container..."
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend python -c 'from services.external_systems.excel_is_reader import get_excel_repository; r=get_excel_repository(); n=len(r._students); k=sum(1 for s in r._students if "kibabii" in (s.institution or "").lower()); print("path", r.excel_path); print("students", n); print("kibabii", k); assert n >= 80, n; assert k >= 20, k'
          ENDSSH
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Showing recent logs..."
          ssh dacoris@41.89.92.140 '
            cd /opt/dacoris/rims
            echo "=== Backend Logs ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production logs backend --tail=100
            echo ""
            echo "=== Frontend Logs ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production logs frontend --tail=100
            echo ""
            echo "=== Database Logs ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production logs db --tail=50
          '
          echo ""
          echo "💡 To rollback manually, SSH to the server and run:"
          echo "   cd /opt/dacoris/rims"
          echo "   git reset --hard HEAD~1"
          echo "   docker compose -f docker-compose.prod.yml --env-file .env.production down"
          echo "   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build"
      
      - name: Deployment summary
        if: success()
        run: |
          echo "✨ Deployment completed successfully!"
          echo "📅 Time: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🌐 Application: https://rims.dacoris.com"
          echo "📚 API Docs: https://rims.dacoris.com/apiDocs"

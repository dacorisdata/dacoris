services:
  db:
    image: postgres:15-alpine
    container_name: dacoris-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dacoris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dacoris-network

  backend:
    build: ./backend
    container_name: dacoris-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/dacoris
      - PORT=8000
      - FRONTEND_URL=https://rims.dacoris.com
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ADMIN_SESSION_EXPIRE_MINUTES=${ADMIN_SESSION_EXPIRE_MINUTES}
      - ORCID_CLIENT_ID=${ORCID_CLIENT_ID}
      - ORCID_CLIENT_SECRET=${ORCID_CLIENT_SECRET}
      - ORCID_REDIRECT_URI=https://rims.dacoris.com/api/auth/orcid/callback
      - ORCID_SANDBOX_MODE=${ORCID_SANDBOX_MODE}
      - ORCID_API_BASE_URL=${ORCID_API_BASE_URL}
      - GLOBAL_ADMIN_EMAIL=${GLOBAL_ADMIN_EMAIL}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB}
      - NOTIFICATION_MODE=${NOTIFICATION_MODE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - KOBO_API_BASE_URL=${KOBO_API_BASE_URL}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dacoris-network

  frontend:
    build: ./frontend
    container_name: dacoris-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dacoris-network

  nginx:
    build: ./nginx
    container_name: dacoris-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - dacoris-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  dacoris-network:
    driver: bridge

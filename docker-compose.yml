services:
  db:
    image: postgres:15-alpine
    container_name: dacoris-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Waxmangme86
      POSTGRES_DB: dacoris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dacoris-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dacoris-backend
    stdin_open: true
    tty: true
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:Waxmangme86@db:5432/dacoris
      - FRONTEND_URL=http://192.168.0.103
      - JWT_SECRET_KEY=f61375a0bb2981f19a4391c3e294b49a
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ADMIN_SESSION_EXPIRE_MINUTES=480
      - ORCID_CLIENT_ID=APP-S0GZISHBG32PK5HU
      - ORCID_CLIENT_SECRET=542b22f8-8f65-44a3-a0bd-e5043cc64bbd
      - ORCID_REDIRECT_URI=http://192.168.0.103/api/auth/orcid/callback
      - ORCID_SANDBOX_MODE=false
      - ORCID_API_BASE_URL=https://orcid.org
      - GLOBAL_ADMIN_EMAIL=admin@dacoris.org
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=50
      - NOTIFICATION_MODE=console
      - KOBO_API_BASE_URL=https://kf.kobotoolbox.org/api/v2
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=steveggaita@gmail.com
      - SMTP_PASSWORD=hkpd boqh bupm azka
      - FROM_EMAIL=DACORIS <no-reply@dacoris.org>
      # Admin account creation (set these to auto-create admin on first run)
      - ADMIN_NAME=Global Admin
      - ADMIN_EMAIL=admin@ascensiondynamics.com
      - ADMIN_PASSWORD=Demo@12345
      # MinIO Configuration (Lakehouse Bronze Layer)
      - MINIO_ENDPOINT=http://102.68.87.70:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-your-minio-access-key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-your-minio-secret-key}
      - MINIO_BRONZE_BUCKET=dacoris-bronze
      - MINIO_USE_SSL=false
      # Ingest API Key (shared secret for MinIO ingest service)
      - INGEST_API_KEY=${INGEST_API_KEY:-dev-ingest-key-change-in-production}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dacoris-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ORCID_CLIENT_ID: APP-S0GZISHBG32PK5HU
    container_name: dacoris-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_ORCID_CLIENT_ID=APP-S0GZISHBG32PK5HU
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dacoris-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dacoris-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - dacoris-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  dacoris-network:
    driver: bridge
